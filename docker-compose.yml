# Local development: API + PostgreSQL
# Usage: docker compose up -d
# Then: docker compose exec api npm run db:migrate
# Seed admin: curl -X POST http://localhost:4000/api/auth/seed
# Frontend: run locally with npm run dev:web (proxies /api to localhost:4000)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pspba
      POSTGRES_USER: pspba
      POSTGRES_PASSWORD: pspba
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pspba -d pspba"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgresql://pspba:pspba@postgres:5432/pspba
      JWT_SECRET: dev-jwt-secret-at-least-32-characters-long
    depends_on:
      postgres:
        condition: service_healthy
    # Run migrations then start server
    command: sh -c "npm run db:migrate && node src/server.js"

volumes:
  postgres_data:
